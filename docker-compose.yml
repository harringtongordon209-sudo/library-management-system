version: '3.8'

services:
  # -------------------------------------
  # PostgreSQL: The Main Relational Database
  # -------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: library_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: library_admin
      POSTGRES_PASSWORD: local_password_123
      POSTGRES_DB: library_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_admin -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------
  # Redis: API Caching & Sessions
  # -------------------------------------
  redis:
    image: redis:7-alpine
    container_name: library_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # This command saves a snapshot of the DB every 60 seconds 
    # if at least 1 write operation was performed
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

# -------------------------------------
# Persistent Volumes
# -------------------------------------
volumes:
  postgres_data:
    name: library_postgres_data
  redis_data:
    name: library_redis_data